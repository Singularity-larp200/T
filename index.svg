<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Singularity v2</title>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="position:absolute;inset:0;display:flex;flex-direction:column;background:#0b0d10;font:12px system-ui,sans-serif;">
      <div style="flex:0 0 auto;display:flex;padding:4px 10px;color:#9aa4af;background:#14181d;border-bottom:1px solid #222a33;">
        <span>Singularity v2</span>
        <span id="status" style="margin-left:auto;">loading from repo…</span>
      </div>
      <iframe id="app"
              allow="fullscreen; autoplay; clipboard-read; clipboard-write"
              style="flex:1 1 auto;width:100%;border:0;background:#fff;"></iframe>
    </div>
  </foreignObject>

  <script type="text/javascript"><![CDATA[
    // ---- CONFIG ----------------------------------------------------------
    var REPO    = "Singularity-larp200/SIngularity-v2";
    var BRANCH  = "main";
    var ENTRY   = "public/index.html";            // <- change if your entry file differs
    var BACKEND = "https://singularityv2.vercel.app"; // where /api/* calls go
    var POLL_MS = 60000;
    // ----------------------------------------------------------------------

    var current = null;
    var statusEl = document.getElementById("status");
    var frame = document.getElementById("app");
    function say(t) { statusEl.textContent = t; }

    function latestSha() {
      return fetch("https://api.github.com/repos/" + REPO + "/commits/" + BRANCH)
        .then(function (r) { return r.json(); })
        .then(function (c) { return c.sha || BRANCH; })
        .catch(function () { return BRANCH; });
    }

    function load(sha) {
      var cdn  = "https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/";
      var raw  = "https://raw.githubusercontent.com/" + REPO + "/" + sha + "/" + ENTRY;
      var dir  = cdn + ENTRY.replace(/[^\/]*$/, "");
      say("fetching " + ENTRY + " @ " + sha.slice(0, 7) + "…");

      fetch(raw).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (html) {
        // root-relative asset paths -> repo's public dir on the CDN (correct MIME types)
        var pub = dir.replace(/\/$/, "");
        html = html.replace(/(\s(?:src|href|poster)=["'])\/(?!\/)/g, "$1" + pub + "/");

        // send root-relative fetch/XHR (e.g. /api/...) to the live backend
        var shim = "<base href=\"" + dir + "\">" +
          "<script>(function(){var B=" + JSON.stringify(BACKEND) + ";" +
          "var f=window.fetch;window.fetch=function(u,o){" +
          "if(typeof u==='string'&&u.charAt(0)==='/'&&u.charAt(1)!=='/')u=B+u;return f.call(this,u,o)};" +
          "var x=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){" +
          "if(typeof u==='string'&&u.charAt(0)==='/'&&u.charAt(1)!=='/')arguments[1]=B+u;" +
          "return x.apply(this,arguments)};})();<\/script>";

        html = /<head[^>]*>/i.test(html)
          ? html.replace(/<head[^>]*>/i, function (m) { return m + shim; })
          : shim + html;

        frame.srcdoc = html;
        current = sha;
        say("running commit " + sha.slice(0, 7));
      }).catch(function (e) {
        say("couldn't load " + ENTRY + " (" + e.message + ") – check ENTRY path");
      });
    }

    function tick() {
      latestSha().then(function (sha) { if (sha !== current) load(sha); });
    }
    tick();
    setInterval(tick, POLL_MS);
  ]]></script>
</svg>
